name: Tengeneza Link2APK (Release Rasmi)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Jina la App Yako'
        required: true
        default: 'Aplikasi Yangu'
      target_url:
        description: 'Link ya Tovuti Yako'
        required: true
        default: 'https://www.google.com'
      logo_url:
        description: 'Link ya Logo ya App (.png au .jpg)'
        required: true
        default: 'https://cdn-icons-png.flaticon.com/512/888/888857.png'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kushusha kodi kutoka Repository
      uses: actions/checkout@v4

    - name: Kuweka Java mazingira ya kazi
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Kushusha na Kuweka Injini ya Gradle Wrapper (.jar)
      run: |
        mkdir -p gradle/wrapper
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar

    - name: Kuingiza Link, Jina, Logo, na Kutengeneza Kitambulisho cha Kipekee
      run: |
        mkdir -p app/src/main/java/com/mfumowako/link2apk
        mkdir -p app/src/main/res/drawable
        
        PKG_NAME=$(echo "${{ github.event.inputs.app_name }}" | tr -cd '[:alnum:]' | tr '[:upper:]' '[:lower:]')
        
        sed -i "s/applicationId \"com.mfumowako.link2apk\"/applicationId \"com.link2apk.${PKG_NAME}\"/g" app/build.gradle
        sed -i 's|private static final String TARGET_URL = "https://www.google.com";|private static final String TARGET_URL = "${{ github.event.inputs.target_url }}";|g' app/src/main/java/com/mfumowako/link2apk/MainActivity.java
        sed -i 's/android:label="Link2APK App"/android:label="${{ github.event.inputs.app_name }}"/g' app/src/main/AndroidManifest.xml
        curl -L -o app/src/main/res/drawable/ic_launcher_custom.png "${{ github.event.inputs.logo_url }}"

    - name: Kutoa ruhusa ya kiusalama kwa gradlew
      run: chmod +x gradlew

    - name: Kuanza kutengeneza APK ya Release
      run: ./gradlew assembleRelease

    - name: Kutengeneza Keystore na Kusaini APK Kiotomatiki
      run: |
        keytool -genkey -v -keystore app/build/outputs/apk/release/wsendy.jks -keyalg RSA -keysize 2048 -validity 10000 -alias wsendy -storepass wsendy123 -keypass wsendy123 -dname "CN=wsendy, OU=App, O=Wsendy, L=Dar, S=Tanzania, C=TZ"
        APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name apksigner | sort -V | tail -n 1)
        ZIPALIGN=$(find $ANDROID_HOME/build-tools/ -name zipalign | sort -V | tail -n 1)
        $ZIPALIGN -v 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/wsendy-aligned.apk
        $APKSIGNER sign --ks app/build/outputs/apk/release/wsendy.jks --ks-pass pass:wsendy123 --ks-key-alias wsendy --key-pass pass:wsendy123 --out app/build/outputs/apk/release/wsendy-final.apk app/build/outputs/apk/release/wsendy-aligned.apk

    - name: Kuhifadhi APK Imesainiwa (GitHub Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.app_name }}-Release-APK
        path: app/build/outputs/apk/release/wsendy-final.apk

    - name: Kujiunga na Google Cloud (Firebase)
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    # HAPA NDIPO PALIPOREKEBISHWA: Inasukuma na kufungua ruhusa ya Public kwa kila mtu
    - name: Sukuma APK Imesainiwa kwenda Firebase Storage na kuifanya Public
      run: |
        gcloud storage cp app/build/outputs/apk/release/wsendy-final.apk gs://studio-6468952106-54f12.firebasestorage.app/internal_files/wsendy-app.apk
        gcloud storage objects update gs://studio-6468952106-54f12.firebasestorage.app/internal_files/wsendy-app.apk --add-acl-grant=entity=allUsers,role=READER
