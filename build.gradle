buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Hii inamfanya Gradle 8.4 aelewe com.android.application
        classpath 'com.android.tools.build:gradle:8.2.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
