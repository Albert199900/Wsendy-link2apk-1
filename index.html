<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WSendy Turbo - Link2APK</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #0b0f19; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { max-width: 420px; width: 100%; background: #161c2a; padding: 30px; border-radius: 16px; box-shadow: 0 4px 25px rgba(0,0,0,0.4); border: 1px solid #1f293d; }
        h2 { text-align: center; color: #00ff66; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .subtitle { text-align: center; font-size: 13px; color: #8fa0dd; margin-bottom: 25px; }
        label { font-weight: bold; color: #ccd6f6; display: block; margin-top: 15px; font-size: 13px; }
        input, button { width: 100%; padding: 14px; margin: 8px 0; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        input { background-color: #0b0f19; border: 1px solid #2e3c56; color: #ffffff; transition: 0.3s; }
        input:focus { border-color: #00ff66; outline: none; box-shadow: 0 0 8px rgba(0, 255, 102, 0.2); }
        button { background-color: #00ff66; color: #0b0f19; border: none; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; margin-top: 20px; text-transform: uppercase; }
        button:hover { background-color: #00cc52; box-shadow: 0 0 15px rgba(0, 255, 102, 0.4); }
        #status { text-align: center; font-weight: bold; margin-top: 20px; font-size: 14px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Link2APK Turbo</h2>
    <div class="subtitle">Mfumo wa papo hapo wa WSendy wa kutengeneza programu za Android</div>
    
    <label>Jina la App Yako:</label>
    <input type="text" id="appName" placeholder="Mfano: Aplikasi Yangu" required>

    <label>Link ya Tovuti Yako:</label>
    <input type="url" id="targetUrl" placeholder="https://www.google.com" required>

    <label>Link ya Logo ya App (.png au .jpg):</label>
    <input type="url" id="logoUrl" value="https://i.ibb.co/wNSCPND3/1781975161577.png" required>

    <label>Email ya Mteja (Kupokelea APK):</label>
    <input type="email" id="userEmail" placeholder="mfano@gmail.com" required>

    <button id="btnSubmit" onclick="anzishaMchakatoPapoHapo()">Anza Kuunda APK</button>
    <p id="status"></p>
</div>

<script>
function anzishaMchakatoPapoHapo() {
    const appName = document.getElementById('appName').value.trim();
    const targetUrl = document.getElementById('targetUrl').value.trim();
    const logoUrl = document.getElementById('logoUrl').value.trim();
    const userEmail = document.getElementById('userEmail').value.trim();
    const statusText = document.getElementById('status');
    const btn = document.getElementById('btnSubmit');

    if(!appName || !targetUrl || !logoUrl || !userEmail) {
        alert("Tafadhali jaza nafasi zote!");
        return;
    }

    statusText.innerText = "Inawasha mitambo ya WSendy Turbo... Tafadhali subiri...";
    statusText.style.color = "#8fa0dd";
    btn.disabled = true;
    btn.style.backgroundColor = "#2e3c56";

    // Hapa inasoma kutoka kwenye lile eneo la ufunguo uliloweka mapema
    const FIREBASE_URL = "https://studio-6468952106-54f12-default-rtdb.firebaseio.com/siri.json";

    fetch(FIREBASE_URL)
    .then(res => {
        if(!res.ok) { throw new Error("Firebase error"); }
        return res.json();
    })
    .then(token => {
        if (!token) { throw new Error("Token haipo!"); }

        // Ilasimishe kuwasha 'build-apk.yml' kwa siri hapo hapo
        return fetch('https://api.github.com/repos/Albert199900/Wsendy-link2apk-1/actions/workflows/build-apk.yml/dispatches', {
            method: 'POST',
            headers: {
                'Authorization': `token ${token.trim()}`,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                ref: 'main', 
                inputs: {
                    app_name: appName,
                    target_url: targetUrl,
                    logo_url: logoUrl,
                    user_email: userEmail
                }
            })
        });
    })
    .then(response => {
        if (response.status === 204 || response.status === 200) {
            statusText.innerHTML = "🎉 <span style='color: #00ff66;'>Mtambo umewaka papo hapo!</span><br><span style='color: #ffffff; font-size: 13px;'>Mchakato umeanza kule GitHub Actions chini kwa chini. Angalia email yako baada ya dakika 3.</span>";
        } else {
            return response.text().then(text => { throw new Error(text) });
        }
    })
    .catch(error => {
        console.error(error);
        statusText.innerHTML = "❌ <span style='color: red;'>Mchakato umefeli!</span><br><span style='color: #ffcccc; font-size: 12px;'>Jaribu tena. Hakikisha ufunguo wa Firebase upo sahihi.</span>";
        btn.disabled = false;
        btn.style.backgroundColor = "#00ff66";
    });
}
</script>

</body>
</html>
