<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wsendy Link2APK Builder</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background-color: #f4f4f9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .form-container { 
            max-width: 400px; 
            width: 100%; 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        h2 { 
            text-align: center; 
            color: #333; 
            margin-bottom: 5px; 
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
        }
        label { 
            font-weight: bold; 
            color: #555; 
            display: block; 
            margin-top: 12px; 
        }
        input, button { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            border-radius: 6px; 
            border: 1px solid #ccc; 
            box-sizing: border-box; 
            font-size: 14px; 
        }
        input:focus {
            border-color: #28a745;
            outline: none;
        }
        button { 
            background-color: #28a745; 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold; 
            transition: 0.3s; 
            margin-top: 15px;
        }
        button:hover { 
            background-color: #218838; 
        }
        #status { 
            text-align: center; 
            font-weight: bold; 
            margin-top: 15px; 
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Unda APK Yako Papo Hapo</h2>
    <div class="subtitle">Jaza taarifa kisha APK itatumwa kwenye Email yako ikikamilika.</div>
    
    <label>Jina la App:</label>
    <input type="text" id="appName" placeholder="Mfano: Duka Langu" required>

    <label>Link ya Website:</label>
    <input type="url" id="targetUrl" placeholder="https://www.tovuti.com" required>

    <label>Link ya Logo ya App (.png au .jpg):</label>
    <!-- HAPA LOGO YAKO IMEWEKWA KUWA DEFAULT KWENYE VALUE -->
    <input type="url" id="logoUrl" value="https://i.ibb.co/wNSCPND3/1781975161577.png" required>

    <label>Barua Pepe (Email) Yako:</label>
    <input type="email" id="userEmail" placeholder="mfano@gmail.com" required>

    <button onclick="tumaOmbi()">Anza Kuunda APK</button>
    <p id="status"></p>
</div>

<script>
function tumaOmbi() {
    const appName = document.getElementById('appName').value.trim();
    const targetUrl = document.getElementById('targetUrl').value.trim();
    const logoUrl = document.getElementById('logoUrl').value.trim();
    const userEmail = document.getElementById('userEmail').value.trim();
    const statusText = document.getElementById('status');

    if(!appName || !targetUrl || !logoUrl || !userEmail) {
        alert("Tafadhali jaza nafasi zote!");
        return;
    }

    statusText.innerText = "Inatayarisha data... Tafadhali subiri...";
    statusText.style.color = "#333";

    const GITHUB_USERNAME = "Albert199900";
    const REPO_NAME = "Wsendy-link2apk-1"; 

    statusText.innerText = "🎉 Inakupeleka GitHub Actions sasa hivi...";
    statusText.style.color = "green";

    setTimeout(() => {
        window.location.href = `https://github.com/${GITHUB_USERNAME}/${REPO_NAME}/actions/workflows/android.yml`;
    }, 1500);
}
</script>

</body>
</html>
